[env]
platform = espressif32@6.9.0
board = esp32-s3-n16r8
framework = arduino
monitor_speed = 115200
build_flags =

[env:sender]
build_flags = ${env.build_flags} -D ROLE_SENDER=1
build_src_filter = +<main.cpp>

[env:receiver]
build_flags = ${env.build_flags} -D ROLE_SENDER=0
build_src_filter = +<main.cpp>

[env:c11_bench]
build_flags = ${env.build_flags} -I../../src/netadapt/c11 -Os
build_src_filter = +<c11_bench_main.cpp> +<c11_sched_unit.c>
