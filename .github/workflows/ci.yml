name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install setuptools wheel
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-build-isolation
      - run: python -m pytest -q
      - run: python scripts/benchmark_c11_footprint.py
      - run: python -m platformio run -d hardware/firmware -e sender -e receiver
      - run: python scripts/audit_firmware.py
